//Question 5//
let units = 150;
let bill;

if (units < 0) {
    console.log("Invalid units");
} else if (units <= 100) {
    bill = units * 10;
    console.log("Electricity bill: Rs. " + bill);
} else if (units <= 200) {
    bill = (100 * 10) + ((units - 100) * 15);
    console.log("Electricity bill: Rs. " + bill);
} else {
    bill = (100 * 10) + (100 * 15) + ((units - 200) * 20);
    console.log("Electricity bill: Rs. " + bill);
}
